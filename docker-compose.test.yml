# docker-compose.test.yml — Unified test environment
# Brings up ZITADEL + Lago + Platform PostgreSQL for end-to-end testing.
#
# Usage:
#   docker compose -f docker-compose.test.yml --env-file .env.test up -d
#   docker compose -f docker-compose.test.yml --env-file .env.test down -v

name: vlogbin-test

networks:
  test-net:
    name: vlogbin-test-net

volumes:
  platform-pgdata:
  zitadel-pgdata:
  zitadel-bootstrap:
  lago-pgdata:
  lago-redis-data:
  lago-storage-data:
  lago-rsa-data:

services:
  # ============================================================
  # Platform PostgreSQL (existing dev database)
  # ============================================================
  platform-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "${PLATFORM_DB_PORT:-5432}:5432"
    volumes:
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
      - platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - test-net

  # ============================================================
  # ZITADEL (Hosted Auth / OIDC) — API only, no Traefik
  # ============================================================
  zitadel-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZITADEL_PG_PASSWORD:-postgres}
    volumes:
      - zitadel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zitadel"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - test-net

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.16.0}
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:${ZITADEL_PG_PASSWORD:-postgres}@zitadel-db:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: platform-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Platform Service Account
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/platform-sa.pat
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 15
      start_period: 30s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    ports:
      - "${ZITADEL_PORT:-8080}:8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
    networks:
      - test-net

  # ============================================================
  # Lago (Billing Engine) — pre-built images
  # ============================================================
  lago-db:
    image: getlago/postgres-partman:15.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lago
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: ${LAGO_PG_PASSWORD:-changeme}
      PGDATA: /data/postgres
    volumes:
      - lago-pgdata:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago -d lago"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - test-net

  lago-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lago-redis-data:/data
    networks:
      - test-net

  lago-rsa-keys:
    image: getlago/api:${LAGO_VERSION:-v1.51.0}
    command: ["./scripts/generate.rsa.sh"]
    volumes:
      - lago-rsa-data:/app/config/keys
    networks:
      - test-net

  lago-migrate:
    image: getlago/api:${LAGO_VERSION:-v1.51.0}
    restart: "no"
    depends_on:
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
      lago-rsa-keys:
        condition: service_completed_successfully
    command: ["./scripts/migrate.sh"]
    environment: &lago-env
      DATABASE_URL: postgresql://lago:${LAGO_PG_PASSWORD:-changeme}@lago-db:5432/lago?search_path=public
      REDIS_URL: redis://lago-redis:6379
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2}
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      LAGO_RSA_PRIVATE_KEY: ""
      LAGO_SIDEKIQ_WEB: "true"
      LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
      LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
      LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
      LAGO_USE_AWS_S3: "false"
      LAGO_DISABLE_SEGMENT: "true"
      LAGO_DISABLE_WALLET_REFRESH: "true"
      LAGO_DISABLE_SIGNUP: "false"
      LAGO_PDF_URL: http://lago-pdf:3000
      LAGO_API_URL: http://lago-api:3000
      LAGO_FRONT_URL: http://lago-front:80
    volumes:
      - lago-rsa-data:/app/config/keys
    networks:
      - test-net

  lago-api:
    image: getlago/api:${LAGO_VERSION:-v1.51.0}
    restart: unless-stopped
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    command: ["./scripts/start.api.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      start_period: 30s
      timeout: 60s
    environment:
      <<: *lago-env
    volumes:
      - lago-storage-data:/app/storage
      - lago-rsa-data:/app/config/keys
    ports:
      - "${LAGO_API_PORT:-3000}:3000"
    networks:
      - test-net

  lago-worker:
    image: getlago/api:${LAGO_VERSION:-v1.51.0}
    restart: unless-stopped
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    command: ["./scripts/start.worker.sh"]
    environment:
      <<: *lago-env
    volumes:
      - lago-storage-data:/app/storage
      - lago-rsa-data:/app/config/keys
    networks:
      - test-net

  lago-clock:
    image: getlago/api:${LAGO_VERSION:-v1.51.0}
    restart: unless-stopped
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    command: ["./scripts/start.clock.sh"]
    environment:
      <<: *lago-env
    volumes:
      - lago-rsa-data:/app/config/keys
    networks:
      - test-net

  lago-pdf:
    image: getlago/lago-gotenberg:7.8.2
    restart: unless-stopped
    networks:
      - test-net

  lago-front:
    image: getlago/front:${LAGO_VERSION:-v1.51.0}
    restart: unless-stopped
    depends_on:
      lago-api:
        condition: service_healthy
    environment:
      API_URL: http://lago-api:3000
      APP_ENV: production
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
    ports:
      - "${LAGO_FRONT_PORT:-8081}:80"
    networks:
      - test-net
