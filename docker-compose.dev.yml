# docker-compose.dev.yml — Long-running local development environment.
#
# Brings up the full stack as long-lived containers reachable from the host:
#   - Platform PostgreSQL (RLS-enabled)
#   - Platform API (Go)            http://localhost:8080  (health: /health)
#   - Provider Console (Next.js)   http://localhost:3001
#
# ZITADEL / Lago are NOT required for the core console; start them on demand
# with the optional profile:
#   docker compose -f docker-compose.dev.yml --profile billing up -d
#
# Usage:
#   cp .env.dev .env
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml logs -f api web
#   docker compose -f docker-compose.dev.yml down      # stop, keep data
#   docker compose -f docker-compose.dev.yml down -v   # stop + wipe volumes

name: vlogbin-dev

networks:
  dev-net:
    name: vlogbin-dev-net

volumes:
  platform-pgdata:

services:
  # ============================================================
  # Platform PostgreSQL (RLS-enabled, migrated on API startup)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
      - platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - dev-net

  # ============================================================
  # Platform API (Go) — built from apps/api/Dockerfile
  # Applies embedded migrations at startup, serves the v1 HTTP API,
  # and runs the outbox relay + reconciliation + webhook + sweepers.
  # ============================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connect as platform_app so RLS applies to every query.
      DATABASE_URL: postgres://platform_app:platform_app_dev@postgres:5432/platform?sslmode=disable
      # Migrations need DDL privileges — use the superuser.
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@postgres:5432/platform?sslmode=disable
      HTTP_ADDR: ":8080"
      OPERATOR_TOKEN: "${OPERATOR_TOKEN:-dev-operator-token-change-me}"
      PLATFORM_BASE_DOMAIN: "${PLATFORM_BASE_DOMAIN:-platform.local}"
      BILLING_ADAPTER: "${BILLING_ADAPTER:-noop}"
      LAGO_API_URL: "${LAGO_API_URL:-}"
      LAGO_API_KEY: "${LAGO_API_KEY:-}"
      PSP_MASTER_KEY: "${PSP_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      ZITADEL_URL: "${ZITADEL_URL:-}"
      ZITADEL_PAT: "${ZITADEL_PAT:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # 本地开发/CI 放宽限流（生产默认值不变），避免 e2e 大列表场景下
      # 请求累积触发 429 导致 flaky。web 端 N+1 聚合已限并发（R29）。
      RL_ENDPOINT_LIMIT: "${RL_ENDPOINT_LIMIT:-600}"
      RL_CREDENTIAL_LIMIT: "${RL_CREDENTIAL_LIMIT:-3000}"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - dev-net

  # ============================================================
  # Provider Console (Next.js) — built from apps/web/Dockerfile
  # Server Components talk to the API over the internal network.
  # ============================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Internal Docker DNS — the web container calls the API directly.
      PLATFORM_API_URL: "http://api:8080"
      OPERATOR_TOKEN: "${OPERATOR_TOKEN:-dev-operator-token-change-me}"
      # Session encryption key (dev default; override in production).
      SESSION_SECRET: "${SESSION_SECRET:-dev-only-session-secret-change-me-in-production-0123456789abcdef}"
      # Dev stack authenticates via the operator token form (no ZITADEL).
      AUTH_MODE: "${AUTH_MODE:-operator-token}"
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dev-net
