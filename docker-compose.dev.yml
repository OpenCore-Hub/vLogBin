services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
      - platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  platform-pgdata:
