name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/api/go.sum
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Go build
        working-directory: apps/api
        run: go build ./...
      - name: Go vet
        working-directory: apps/api
        run: go vet ./...
      - name: Go unit + config
        working-directory: apps/api
        run: go test ./internal/config ./internal/httpapi ./internal/service -count=1
      - name: Web typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit
      - name: Web lint
        working-directory: apps/web
        run: pnpm exec eslint src --max-warnings=0
      - name: Web unit
        working-directory: apps/web
        run: pnpm run test:unit
      - name: Web build
        working-directory: apps/web
        run: pnpm run build

  zitadel-e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/api/go.sum
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Real ZITADEL browser E2E
        run: bash scripts/ci-zitadel-e2e.sh
