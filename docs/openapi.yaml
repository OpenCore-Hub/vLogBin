openapi: 3.1.0
info:
  title: vLogBin Platform API
  version: "1.0"
  description: |
    Multi-Provider identity and billing infrastructure platform.
    
    ## Authentication
    
    All API requests require a Bearer token (API key) in the `Authorization` header.
    Operator endpoints use OIDC JWT tokens (ZITADEL Hosted Auth).

    ## Environment Isolation

    Every API key is bound to exactly one environment (test or live); tenant
    context always comes from the credential, never from request input.
    Provider-domain clients may send `X-Environment: test|live` as a safety
    check: when present it must match the key's environment, otherwise the
    API rejects the request with `400 environment_mismatch`. Console
    control-plane endpoints select the environment explicitly via `?env=`.
    
    ## API Versioning
    
    Breaking API versions run in parallel for at least 12 months.
    Deprecated endpoints return `Sunset`, `Deprecation`, and `Link` headers.
    Webhook payloads include `X-Webhook-Schema-Version: 1.0`.
    
    ## Rate Limiting
    
    Four-level rate limiting: Provider, Environment, Credential, Endpoint.
    Rate limit headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`.
    
    ## Error Format
    
    All errors follow RFC 7807 Problem Details:
    ```json
    {
      "error": {
        "code": "not_found",
        "message": "resource not found",
        "request_id": "uuid"
      }
    }
    ```
  contact:
    name: vLogBin Platform
    url: https://github.com/OpenCore-Hub/vLogBin
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://api.vlogbin.com/v1
    description: Production
  - url: https://api.staging.vlogbin.com/v1
    description: Staging

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Provider API key or OIDC JWT token
  
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            request_id:
              type: string
              format: uuid
              description: Request correlation ID
    
    Provider:
      type: object
      description: Provider（平台控制面视角，与 lib/api/types.ts Provider 对齐）
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        lifecycle_state:
          type: string
          description: 生命周期状态（REGISTERED / LIVE_REVIEW / LIVE_ACTIVE / RESTRICTED / SUSPENDED / RETIRED）
        sla_tier:
          type: string
        home_region_id:
          type: string
          format: uuid
        home_region_code:
          type: string
        cell_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    CustomerAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        name:
          type: string
        email:
          type: string
        type:
          type: string
          enum: [individual, business]
    
    Subscription:
      type: object
      description: 订阅（operator 视图，与 lib/api/types.ts Subscription 对齐；provider 域入参端点不复用此 schema）
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        customer_external_id:
          type: string
        plan_code:
          type: string
        catalog_version_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, terminated]
        environment_kind:
          type: string
          enum: [test, live]
        started_at:
          type: string
          format: date-time
        terminated_at:
          type: string
          format: date-time
    
    UsageEvent:
      type: object
      required: [transaction_id, customer_external_id, metric_code, timestamp, properties]
      properties:
        transaction_id:
          type: string
        customer_external_id:
          type: string
        metric_code:
          type: string
        timestamp:
          type: string
          format: date-time
        properties:
          type: object
    
    QuotaReservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        quota_key:
          type: string
        amount:
          type: integer
          format: int64
        status:
          type: string
          enum: [reserved, committed, released, expired]
        reservation_id:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        committed_at:
          type: string
          format: date-time
          nullable: true
        released_at:
          type: string
          format: date-time
          nullable: true
    
    SupportSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        access_type:
          type: string
          enum: [standard, emergency]
        status:
          type: string
          enum: [requested, active, expired, revoked, denied]
        reason:
          type: string
        requested_by:
          type: string
        requested_scopes:
          type: array
          items:
            type: string
        approved_by:
          type: string
          nullable: true
        second_approver:
          type: string
          nullable: true
        granted_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_by:
          type: string
          nullable: true
        revoke_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RiskReview:
      type: object
      description: Provider go-live 风险审核记录（operator 内部评级）
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        checks:
          type: object
          additionalProperties:
            type: boolean
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
        reviewed_by:
          type: string
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    
    TeamMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, billing_admin, developer, support_agent]
        status:
          type: string
          enum: [active, suspended, removed]
    
    SCIMUser:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        externalId:
          type: string
        userName:
          type: string
        displayName:
          type: string
        active:
          type: boolean
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              primary:
                type: boolean
    
    CustomDomain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        domain:
          type: string
        status:
          type: string
          enum: [pending, verified, revoked]
        verification_token:
          type: string
        verified_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationConfig:
      type: object
      description: 通知渠道配置（config 为解密后的渠道凭据，仅本会话可见）
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, sms]
        provider_type:
          type: string
        config:
          type: object
          additionalProperties: true
        from_address:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationConfigInput:
      type: object
      description: 保存通知渠道配置的入参（config 会加密存储）
      required: [channel, provider_type, config, from_address]
      properties:
        channel:
          type: string
          enum: [email, sms]
        provider_type:
          type: string
        config:
          type: object
          additionalProperties: true
        from_address:
          type: string
        enabled:
          type: boolean
          default: true
    
    MigrationJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_system:
          type: string
        status:
          type: string
          enum: [draft, validating, validated, importing, completed, failed, rolled_back]
        total_records:
          type: integer
        processed_records:
          type: integer
        cutover_locked:
          type: boolean
    
    DataExport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [requested, processing, completed, failed]
        export_type:
          type: string
          enum: [full, audit_only, billing_only]
        data_hash:
          type: string
        record_count:
          type: integer
    
    Cell:
      type: object
      properties:
        id:
          type: string
          format: uuid
        region_id:
          type: string
          format: uuid
        code:
          type: string
        cell_type:
          type: string
          enum: [shared, dedicated]
        status:
          type: string
          enum: [active, draining, inactive]
        capacity_limits:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    CellFailover:
      type: object
      description: Cell 故障切换记录
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        from_cell_id:
          type: string
          format: uuid
        to_cell_id:
          type: string
          format: uuid
        status:
          type: string
        reason:
          type: string
        initiated_by:
          type: string
        fencing_token:
          type: string
        replayed_usage:
          type: integer
        replayed_outbox:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    CellMigration:
      type: object
      description: Cell 迁移任务
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        from_cell_id:
          type: string
          format: uuid
        to_cell_id:
          type: string
          format: uuid
        status:
          type: string
        scheduled_at:
          type: string
          format: date-time
        precheck_passed:
          type: boolean
        data_integrity_hash:
          type: string
        record_count:
          type: integer
        reason:
          type: string
        initiated_by:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    MeteredPricingRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        metric_code:
          type: string
        pricing_model:
          type: string
          enum: [per_unit, tiered, volume, stairstep]
        base_price_cents:
          type: integer
          format: int64
        minimum_spend_cents:
          type: integer
          format: int64
        enabled:
          type: boolean
    
    BudgetAlert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        budget_cents:
          type: integer
          format: int64
        threshold_pct:
          type: number
        current_spend_cents:
          type: integer
          format: int64
        alert_status:
          type: string
          enum: [ok, warning, exceeded]

    # ---- operator 域实体（与 apps/web/src/lib/api/types.ts 逐一对齐）----
    Environment:
      type: object
      description: 环境（test / live 双环境模型）
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [test, live]
        status:
          type: string
        issuer:
          type: string
        created_at:
          type: string
          format: date-time

    Region:
      type: object
      description: 区域（region registry）
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        jurisdiction:
          type: string

    CatalogVersion:
      type: object
      description: Catalog 版本列表行（轻量视图）
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        state:
          type: string
          enum: [draft, validated, published, retired]
        environment_id:
          type: string
          format: uuid
        environment_kind:
          type: string
          enum: [test, live]
        metrics_count:
          type: integer
        plans_count:
          type: integer
        created_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time

    CatalogVersionMeta:
      type: object
      description: Catalog 版本全量元数据
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        version:
          type: integer
        state:
          type: string
        created_at:
          type: string
          format: date-time
        validated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time

    CatalogVersionDetail:
      type: object
      description: Catalog 版本详情（版本 + 全部组成元素）
      properties:
        version:
          $ref: '#/components/schemas/CatalogVersionMeta'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
        entitlement_grants:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementGrant'

    Metric:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        aggregation_type:
          type: string
        field_name:
          type: string
        billable:
          type: boolean

    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        interval:
          type: string
        currency:
          type: string

    Price:
      type: object
      properties:
        id:
          type: string
          format: uuid
        charge_model:
          type: string
          enum: [fixed, per_unit, tiered]
        metric_code:
          type: string
        properties:
          type: object

    EntitlementGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        value_type:
          type: string
        value:
          nullable: true

    PriceInput:
      type: object
      description: 套餐价格入参（fixed 固定价 / per_unit 按量 / tiered 阶梯价）
      required: [charge_model, properties]
      properties:
        metric_code:
          type: string
          description: per_unit / tiered 必填；引用当前目录版本中的 metric
        charge_model:
          type: string
          enum: [fixed, per_unit, tiered]
        properties:
          type: object
          description: fixed=amount_cents+currency；per_unit=unit_amount_cents；tiered=tiers[]

    EntitlementInput:
      type: object
      description: 套餐权益入参（PlanInput.entitlements 可选）
      required: [key, value_type, value]
      properties:
        key:
          type: string
        value_type:
          type: string
          enum: [boolean, numeric, period]
        value:
          description: 按 value_type 的 JSON 值

    ProviderAnalyticsDashboard:
      type: object
      description: Console Analytics（M4）一次请求全量载荷
      properties:
        revenue:
          type: array
          items:
            type: object
            properties:
              provider_id: { type: string }
              month: { type: string }
              invoice_count: { type: integer }
              subscription_count: { type: integer }
              total_revenue_cents: { type: integer }
              avg_invoice_line_cents: { type: number }
        mau:
          type: array
          items:
            type: object
            properties:
              provider_id: { type: string }
              month: { type: string }
              active_customers: { type: integer }
              unique_metrics: { type: integer }
              total_usage_events: { type: integer }
        conversion:
          type: array
          items:
            type: object
            properties:
              provider_id: { type: string }
              signup_month: { type: string }
              new_customers: { type: integer }
              customers_with_subscription: { type: integer }
              active_subscriptions: { type: integer }
        churn:
          type: array
          items:
            type: object
            properties:
              provider_id: { type: string }
              churn_month: { type: string }
              churned_subscriptions: { type: integer }
              retained_subscriptions: { type: integer }
        anomalies:
          type: array
          items:
            type: object
            properties:
              provider_id: { type: string }
              metric_code: { type: string }
              day: { type: string }
              event_count: { type: integer }
              avg_7d: { type: number }
              is_anomaly: { type: boolean }
        generated_at:
          type: string
          format: date-time

    PlanInput:
      type: object
      description: 套餐创建/更新入参（plan code 不可变；更新时 body code 必须与路径一致）
      required: [code, name, interval, currency, prices]
      properties:
        code:
          type: string
        name:
          type: string
        interval:
          type: string
          enum: [weekly, monthly, yearly]
        currency:
          type: string
          description: 3 位 ISO 4217 货币代码
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PriceInput'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementInput'

    PlanDetail:
      type: object
      description: Console 控制面套餐详情（prices 的 metric_code 已解析，便于前端直接渲染/编辑）
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
        entitlement_grants:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementGrant'

    PlanCollection:
      type: object
      description: Plans 页面一次请求的全量载荷（当前 draft 版本，无 draft 回退 latest published）
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanDetail'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'

    Credential:
      type: object
      description: API 密钥（key_hash 永不下发，仅 key_prefix 标识）
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        allowed_cidrs:
          type: array
          items:
            type: string
        environment_id:
          type: string
          format: uuid
        environment_kind:
          type: string
          enum: [test, live]
        environment_issuer:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CredentialCreateInput:
      type: object
      description: Console 创建 API 密钥入参
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          description: 可选，必须是未来时间
        created_by:
          type: string
          description: 审计 actor 标识，默认 operator

    CreatedCredentialResult:
      type: object
      description: 创建 / 轮换 API 密钥的响应（明文 api_key 只返回一次）
      properties:
        credential:
          $ref: '#/components/schemas/Credential'
        api_key:
          type: string

    Invoice:
      type: object
      description: 发票（Lago 同步）
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        lago_id:
          type: string
        issuing_date:
          type: string
          format: date
        invoice_type:
          type: string
        status:
          type: string
        payment_status:
          type: string
        currency:
          type: string
        total_amount_cents:
          type: integer
          format: int64
        customer_external_id:
          type: string
        customer_account_id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        catalog_version_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        environment_kind:
          type: string
          enum: [test, live]

    InvoiceLine:
      type: object
      description: 发票行明细
      properties:
        id:
          type: string
          format: uuid
        lago_fee_id:
          type: string
        metric_code:
          type: string
        item_type:
          type: string
        item_name:
          type: string
        units:
          type: string
        precise_unit_amount:
          type: string
        amount_cents:
          type: integer
          format: int64
        taxes_amount_cents:
          type: integer
          format: int64
        total_amount_cents:
          type: integer
          format: int64
        currency:
          type: string
        event_transaction_id:
          type: string
        from_date:
          type: string
          format: date-time
        to_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    InvoiceDetail:
      type: object
      description: 发票详情（发票 + 行明细）
      properties:
        invoice:
          $ref: '#/components/schemas/Invoice'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'

    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        provider_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        actor_type:
          type: string
        actor_id:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          nullable: true
        request_id:
          type: string
        created_at:
          type: string
          format: date-time

    AuditStats:
      type: object
      properties:
        total:
          type: integer
          format: int64
        by_action:
          type: array
          items:
            $ref: '#/components/schemas/AuditCount'
        by_actor_type:
          type: array
          items:
            $ref: '#/components/schemas/AuditCount'
        series:
          type: array
          items:
            $ref: '#/components/schemas/AuditSeriesPoint'

    AuditCount:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64

    AuditSeriesPoint:
      type: object
      properties:
        bucket:
          type: string
          format: date-time
        count:
          type: integer
          format: int64

    AuditChainState:
      type: object
      properties:
        total_events:
          type: integer
          format: int64
        tail_hash:
          type: string
          nullable: true
        tail_event_id:
          type: integer
          format: int64
          nullable: true
        last_anchor_id:
          type: integer
          format: int64
        last_anchor_event_id:
          type: integer
          format: int64
        last_anchor_hash:
          type: string
        last_anchor_at:
          type: string
          format: date-time

    AuditChainVerifyResult:
      type: object
      properties:
        ok:
          type: boolean
        verified_from:
          type: integer
          format: int64
        verified_to:
          type: integer
          format: int64
        verified_count:
          type: integer
          format: int64
        broken_at:
          type: integer
          format: int64
          nullable: true
        reason:
          type: string

    Customer:
      type: object
      description: 客户（operator 视图）
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        account_type:
          type: string
          enum: [individual, business]
        display_name:
          type: string
        environment_id:
          type: string
          format: uuid
        environment_kind:
          type: string
          enum: [test, live]
        created_at:
          type: string
          format: date-time

    CustomerCreateInput:
      type: object
      description: 客户创建入参（external_id 在 provider 环境内唯一）
      required: [external_id, account_type, display_name]
      properties:
        external_id:
          type: string
        account_type:
          type: string
          enum: [individual, business]
        display_name:
          type: string

    CustomerDetail:
      type: object
      description: 客户详情（一次请求返回客户 + 订阅 / 用量 / 账单，同环境）
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        usage_events:
          type: array
          items:
            $ref: '#/components/schemas/UsageEventRecord'
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'

    PortalTokenResult:
      type: object
      description: 客户门户邀请 Token（短时有效，签发后仅本响应可见）
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        portal_url:
          type: string
        customer_id:
          type: string
        environment:
          type: string
          enum: [test, live]

    PortalSession:
      type: object
      description: Portal token 校验结果
      properties:
        valid:
          type: boolean
        provider_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        environment_kind:
          type: string
          enum: [test, live]
        customer_external_id:
          type: string
        expires_at:
          type: string
          format: date-time

    PortalDashboard:
      type: object
      description: 客户门户 Dashboard（仅当前客户数据 + workspace 品牌）
      properties:
        provider_name:
          type: string
        provider_slug:
          type: string
        customer:
          $ref: '#/components/schemas/Customer'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        usage_events:
          type: array
          items:
            $ref: '#/components/schemas/UsageEventRecord'
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'

    UsageEventRecord:
      type: object
      description: 用量事件（operator 视图，对应 lib/api/types.ts 的 UsageEvent；openapi 同名 UsageEvent 为 provider 域入参 schema）
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
        kind:
          type: string
          enum: [ingestion, reversal]
        metric_code:
          type: string
        customer_external_id:
          type: string
        environment_id:
          type: string
          format: uuid
        environment_kind:
          type: string
          enum: [test, live]
        event_timestamp:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Capability:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        capability:
          type: string
        status:
          type: string
        granted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        granted_by:
          type: string
        reason:
          type: string

    WebhookEndpoint:
      type: object
      description: Webhook 端点（operator 视图；列表响应永不包含 secret）
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        environment_kind:
          type: string
          enum: [test, live]
        environment_issuer:
          type: string
        url:
          type: string
        secret:
          type: string
          description: 仅在创建响应中出现一次
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookCreateInput:
      type: object
      description: Console 创建 Webhook 端点入参
      required: [url]
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
          description: 空数组订阅全部事件
        secret:
          type: string
          description: 可选；留空自动生成
        created_by:
          type: string
          description: 审计 actor 标识，默认 operator

    PlatformEvent:
      type: object
      description: Console 事件流视图（payload 为已解码 JSON）
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        environment_kind:
          type: string
          enum: [test, live]
        aggregate_type:
          type: string
        aggregate_id:
          type: string
        event_type:
          type: string
        payload:
          description: 原始 JSONB 载荷，解码后的任意 JSON
        payload_hash:
          type: string
        transaction_id:
          type: string
        status:
          type: string
          enum: [pending, failed, published, dead_letter]
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
        last_error:
          type: string

    PlatformEventStream:
      type: object
      description: 事件流分页响应（cursor 为上一页最后一个事件 id）
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/PlatformEvent'
        next_cursor:
          type: string
          format: uuid
          nullable: true
        has_more:
          type: boolean

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        outbox_event_id:
          type: string
          format: uuid
        status:
          type: string
        attempts:
          type: integer
        response_status:
          type: integer
        response_body:
          type: string
        delivered_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Workspace:
      type: object
      description: 工作区（平台控制面多租户单元）
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        user_sub:
          type: string
        role:
          type: string
          enum: [provider_admin, provider_developer, provider_billing]
        status:
          type: string
          enum: [active, suspended, removed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HostedAuthConfig:
      type: object
      description: OIDC 应用（Console 控制面视图；client_secret 永不随列表返回）
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        client_id:
          type: string
        enabled:
          type: boolean
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HostedAuthCreateResult:
      type: object
      description: 创建 / 轮换密钥后的应用响应（明文 client_secret 仅返回一次，R17）
      allOf:
        - $ref: '#/components/schemas/HostedAuthConfig'
        - type: object
          properties:
            client_secret:
              type: string
              description: 明文客户端密钥，仅在创建/轮换成功时返回一次
            issuer_url:
              type: string
              format: uri

    TrendPoint:
      type: object
      description: 趋势序列单日数据点；date 为 ISO-8601 日期（YYYY-MM-DD，UTC）
      properties:
        date:
          type: string
          format: date
        value:
          type: integer
          format: int64

    OverviewTrends:
      type: object
      description: 概览趋势序列（M2），两序列均为后端补零后的连续日轴
      properties:
        revenue:
          type: array
          description: 近 30 天 finalized 发票按出票日汇总金额（cents）
          items:
            $ref: '#/components/schemas/TrendPoint'
        usage_events:
          type: array
          description: 近 30 天 ingestion 事件按入库日计数
          items:
            $ref: '#/components/schemas/TrendPoint'

    OverviewStats:
      type: object
      description: 概览聚合统计（R29，跨所有 provider 单请求聚合）
      properties:
        published_versions:
          type: integer
        active_subscriptions:
          type: integer
        customers:
          type: integer
        revenue_cents:
          type: integer
          format: int64
        trends:
          $ref: '#/components/schemas/OverviewTrends'

    LifecycleTarget:
      type: string
      description: Provider 生命周期流转目标
      enum: [LIVE_REVIEW, LIVE_ACTIVE, RESTRICTED, SUSPENDED]

    CreateProviderInput:
      type: object
      required: [slug, name, home_region_code]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        name:
          type: string
        home_region_code:
          type: string
        description:
          type: string

    ActivateProviderInput:
      type: object
      required: [provider_id, home_region_code]
      properties:
        provider_id:
          type: string
          format: uuid
        home_region_code:
          type: string
        reason:
          type: string

    LifecycleInput:
      type: object
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/LifecycleTarget'
        reason:
          type: string

    SignupInput:
      type: object
      properties:
        email:
          type: string
        name:
          type: string

    CreateProviderResult:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
          nullable: true
        testEnvironment:
          $ref: '#/components/schemas/Environment'
          nullable: true
        apiKey:
          type: string
          nullable: true

    LifecycleResult:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
          nullable: true
        environment:
          $ref: '#/components/schemas/Environment'
          nullable: true
        apiKey:
          type: string
          nullable: true

    SignupResult:
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
          nullable: true
        membership:
          $ref: '#/components/schemas/WorkspaceMembership'
          nullable: true
        provider:
          $ref: '#/components/schemas/Provider'
          nullable: true

    AuditPageResult:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: integer
          nullable: true

    CreatedCredential:
      type: object
      properties:
        credential:
          $ref: '#/components/schemas/Credential'
          nullable: true
        api_key:
          type: string

    PortalSessionInfo:
      type: object
      properties:
        valid:
          type: boolean
        provider_id:
          type: string
        environment_id:
          type: string
        environment_kind:
          type: string
        customer_external_id:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true

    QuotaLimitUsage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        quota_key:
          type: string
        limit_value:
          type: integer
          format: int64
        period_type:
          type: string
          enum: [daily, monthly, total]
        committed:
          type: integer
          format: int64
        reserved:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QueueOverview:
      type: object
      properties:
        outbox:
          type: object
          additionalProperties:
            type: integer
            format: int64
        webhook_deliveries:
          type: object
          additionalProperties:
            type: integer
            format: int64
        recent_outbox:
          type: array
          items:
            $ref: '#/components/schemas/PlatformEvent'

    AnalyticsRevenueSummary:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        month:
          type: string
        invoice_count:
          type: integer
        subscription_count:
          type: integer
        total_revenue_cents:
          type: integer
        avg_invoice_line_cents:
          type: integer

    AnalyticsMAUSummary:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        month:
          type: string
        active_customers:
          type: integer
        unique_metrics:
          type: integer
        total_usage_events:
          type: integer

    AnalyticsConversionSummary:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        signup_month:
          type: string
        new_customers:
          type: integer
        customers_with_subscription:
          type: integer
        active_subscriptions:
          type: integer

    AnalyticsChurnSummary:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        churn_month:
          type: string
        churned_subscriptions:
          type: integer
        retained_subscriptions:
          type: integer

    AnalyticsAnomaly:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        metric_code:
          type: string
        day:
          type: string
        event_count:
          type: integer
        avg_7d:
          type: number
        is_anomaly:
          type: boolean

    AnalyticsDashboard:
      type: object
      properties:
        revenue:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRevenueSummary'
        mau:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsMAUSummary'
        conversion:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsConversionSummary'
        churn:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsChurnSummary'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsAnomaly'
        generated_at:
          type: string
          format: date-time

    ReconciliationResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        check_name:
          type: string
        status:
          type: string
          enum: [ok, drift, error]
        expected_count:
          type: integer
          format: int64
        actual_count:
          type: integer
          format: int64
        drift_count:
          type: integer
          format: int64
        details:
          type: object
          additionalProperties: true
        checked_at:
          type: string
          format: date-time

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      schema:
        type: string
        format: uuid
    ProviderID:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Env:
      name: env
      in: query
      required: true
      schema:
        type: string
        enum: [test, live]
      description: 目标环境（test/live），由 API 侧解析为该 provider 的环境 ID
    VersionID:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanCode:
      name: plan_code
      in: path
      required: true
      schema:
        type: string
      description: 套餐代码（不可变标识符）
    CustomerExternalID:
      name: customer_external_id
      in: path
      required: true
      schema:
        type: string
      description: 客户外部 ID（provider 环境内唯一）
    InvoiceID:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 发票 ID

tags:
  - name: Providers
    description: Provider lifecycle management
  - name: Customers
    description: Customer account management
  - name: Subscriptions
    description: Subscription lifecycle
  - name: Usage
    description: Usage event ingestion
  - name: Invoices
    description: Invoice sync and management
  - name: Quota
    description: Hard quota ledger (reserve/commit/release)
  - name: Support
    description: JIT support access
  - name: Team
    description: Delegated administration
  - name: Events
    description: Enterprise event streams
  - name: Migration
    description: Standard migration tools
  - name: Custom Domains
    description: Custom auth domain management
  - name: SCIM
    description: SCIM 2.0 user provisioning
  - name: Analytics
    description: Independent analytic plane
  - name: Metered Billing
    description: Metered pricing and budget alerts
  - name: Cells
    description: Cell registry and failover
  - name: Data Export
    description: Data export and deletion proof
  - name: API Version
    description: API version info
  - name: Operator
    description: Operator 控制面（providers / catalog / regions / overview）
  - name: Workspaces
    description: 工作区（operator 会话域，RLS 保护）
  - name: Signup
    description: 注册供给（R11）

paths:
  /api-version:
    get:
      tags: [API Version]
      summary: Get API version info
      security: []
      responses:
        '200':
          description: API version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_version:
                    type: string
                  supported_versions:
                    type: array
                    items:
                      type: string
                  compatibility_policy:
                    type: string
                  webhook_schema_version:
                    type: string
                  deprecated_endpoints:
                    type: array
                    items:
                      type: object

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      responses:
        '200':
          description: List of customers
    post:
      tags: [Customers]
      summary: Create a customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAccount'
      responses:
        '201':
          description: Customer created

  /subscriptions:
    get:
      tags: [Contract]
      summary: Get /subscriptions
      responses:
        '200':
          description: OK
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      responses:
        '201':
          description: Subscription created
        '409':
          description: Cutover locked or cell draining

  /usage/ingest:
    post:
      tags: [Usage]
      summary: Ingest a usage event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageEvent'
      responses:
        '201':
          description: Usage event ingested
        '409':
          description: Cutover locked or cell draining

  /support-sessions:
    get:
      tags: [Contract]
      summary: Get /support-sessions
      responses:
        '200':
          description: OK
  /team-members:
    get:
      tags: [Team]
      summary: List team members
      responses:
        '200':
          description: List of team members
    post:
      tags: [Team]
      summary: Invite a team member
      responses:
        '201':
          description: Team member invited

  /events:
    get:
      tags: [Events]
      summary: Stream events (cursor-based pagination)
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: type
          in: query
          schema:
            type: string
        - name: aggregate_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Event stream page

  /migrations:
    get:
      tags: [Contract]
      summary: Get /migrations
      responses:
        '200':
          description: OK
    post:
      tags: [Migration]
      summary: Create a migration job
      responses:
        '201':
          description: Migration job created

  /custom-domains:
    get:
      tags: [Contract]
      summary: Get /custom-domains
      responses:
        '200':
          description: OK
    post:
      tags: [Custom Domains]
      summary: Register a custom domain
      responses:
        '201':
          description: Domain registered
        '409':
          description: Domain already taken

  /scim/v2/Users:
    get:
      tags: [SCIM]
      summary: List SCIM users
      responses:
        '200':
          description: SCIM list response
    post:
      tags: [SCIM]
      summary: Create a SCIM user
      responses:
        '201':
          description: SCIM user created

  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Get provider analytics dashboard
      responses:
        '200':
          description: Combined analytics dashboard

  /metered-pricing-rules:
    get:
      tags: [Contract]
      summary: Get /metered-pricing-rules
