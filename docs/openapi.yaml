                    $ref: '#/components/schemas/HostedAuthCreateResult'
        '400':
          description: Invalid input

  /operator/providers/{provider_id}/auth/zitadel/rotate-secret:
    post:
      tags: [Operator]
      summary: Rotate the OIDC client secret (plaintext returned once)
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
      responses:
        '200':
          description: Secret rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/HostedAuthCreateResult'
        '404':
          description: No application configured

  /operator/providers/{provider_id}/auth/zitadel/redirect-uris:
    put:
      tags: [Operator]
      summary: Update OIDC redirect URIs without rotating the secret
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                redirect_uris:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uri
      responses:
        '200':
          description: Redirect URIs updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/HostedAuthConfig'

  /operator/providers/{provider_id}/auth/zitadel:
    delete:
      tags: [Operator]
      summary: Delete the OIDC application (ZITADEL project included)
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
      responses:
        '204':
          description: Application deleted
        '404':
          description: No application configured

  # ---- Plans 控制面（Console，§8 M2）----
  /operator/providers/{provider_id}/catalog/plans:
    get:
      tags: [Operator]
      summary: List plans with full pricing detail and available metrics
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
      responses:
        '200':
          description: Plan collection (plans + metrics)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanCollection'
        '400':
          description: Invalid provider id or env
        '404':
          description: Unknown provider or environment
    post:
      tags: [Operator]
      summary: Create a plan in the current draft catalog version
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Invalid plan structure
        '404':
          description: Unknown provider or environment
        '409':
          description: Plan code already exists

  /operator/providers/{provider_id}/catalog/plans/{plan_code}:
    get:
      tags: [Operator]
      summary: Get one plan with resolved pricing detail
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
        - $ref: '#/components/parameters/PlanCode'
      responses:
        '200':
          description: Plan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/PlanDetail'
        '404':
          description: Unknown plan, provider, or environment
    put:
      tags: [Operator]
      summary: Update a plan (staged into a new draft when published content is immutable)
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
        - $ref: '#/components/parameters/PlanCode'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '200':
          description: Plan updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Invalid plan structure or immutable code mismatch
        '404':
          description: Unknown plan, provider, or environment
    delete:
      tags: [Operator]
      summary: Delete a plan from the current draft catalog version
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
        - $ref: '#/components/parameters/PlanCode'
      responses:
        '204':
          description: Plan deleted
        '404':
          description: Unknown plan, provider, or environment

  /operator/providers/{provider_id}/catalog/plans/{plan_code}/entitlements:
    get:
      tags: [Operator]
      summary: List plan-level entitlement grants (Console Policies page)
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
        - $ref: '#/components/parameters/PlanCode'
      responses:
        '200':
          description: Entitlement grants for the current draft plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlements:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntitlementGrant'
        '404':
          description: Unknown provider, environment, or plan

  /operator/providers/{provider_id}/catalog/plans/{plan_code}/entitlements/{key}:
    put:
      tags: [Operator]
      summary: Upsert one plan-level entitlement grant
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
        - $ref: '#/components/parameters/PlanCode'
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementInput'
      responses:
        '200':
          description: Grant upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlement:
                    $ref: '#/components/schemas/EntitlementGrant'
        '400':
          description: Invalid grant or immutable key mismatch
        '404':
          description: Unknown provider, environment, or plan
    delete:
      tags: [Operator]
      summary: Delete one plan-level entitlement grant
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - $ref: '#/components/parameters/Env'
        - $ref: '#/components/parameters/PlanCode'
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Grant deleted
        '404':
          description: Unknown provider, environment, plan, or grant

