version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/0001_core.sql"
      - "db/migrations/0004_billing_core.sql"
      - "db/migrations/0005_invoice.sql"
      - "db/migrations/0006_provider_capabilities.sql"
      - "db/migrations/0007_invoice_line_traceability.sql"
      - "db/migrations/0008_reconciliation.sql"
      - "db/migrations/0009_webhooks.sql"
      - "db/migrations/0010_psp_credentials.sql"
    queries: "db/queries"
    gen:
      go:
        package: "storegen"
        out: "internal/store/storegen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
