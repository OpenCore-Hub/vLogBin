version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/0001_core.sql"
      - "db/migrations/0004_billing_core.sql"
      - "db/migrations/0005_invoice.sql"
      - "db/migrations/0006_provider_capabilities.sql"
      - "db/migrations/0007_invoice_line_traceability.sql"
      - "db/migrations/0008_reconciliation.sql"
      - "db/migrations/0009_webhooks.sql"
      - "db/migrations/0010_psp_credentials.sql"
      - "db/migrations/0011_provider_auth_configs.sql"
      - "db/migrations/0012_support_sessions.sql"
      - "db/migrations/0013_quota_ledger.sql"
      - "db/migrations/0014_team_members.sql"
      - "db/migrations/0015_migration_plane.sql"
      - "db/migrations/0016_custom_domains.sql"
      - "db/migrations/0017_notification_configs.sql"
      - "db/migrations/0018_sla_tiers.sql"
      - "db/migrations/0019_scim_users.sql"
      - "db/migrations/0020_data_exports.sql"
      - "db/migrations/0021_scim_groups.sql"
      - "db/migrations/0022_cell_failovers.sql"
      - "db/migrations/0023_cell_migrations.sql"
      - "db/migrations/0024_analytics.sql"
      - "db/migrations/0025_metered_billing.sql"
      - "db/migrations/0026_workspaces.sql"
      - "db/migrations/0027_provider_home_region_nullable.sql"
      - "db/migrations/0028_webhook_retention.sql"
      - "db/migrations/0029_idempotency_keys.sql"
      - "db/migrations/0030_audit_retention.sql"
      - "db/migrations/0031_audit_hash_chain.sql"
      - "db/migrations/0032_audit_anchor_archive.sql"
      - "db/migrations/0033_outbox_dead_letter.sql"
      - "db/migrations/0034_provider_risk_reviews.sql"
      - "db/migrations/0035_auth_config_redirect_uris.sql"
      - "db/migrations/0036_auth_config_name.sql"
    queries: "db/queries"
    gen:
      go:
        package: "storegen"
        out: "internal/store/storegen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # jsonb columns that surface in API responses: []byte would be
          # base64-encoded by encoding/json, json.RawMessage keeps the raw JSON.
          - column: "public.entitlement_grants.value"
            go_type: "encoding/json.RawMessage"
          - column: "public.entitlement_overrides.value"
            go_type: "encoding/json.RawMessage"
          - column: "public.prices.properties"
            go_type: "encoding/json.RawMessage"
