# nginx reverse proxy for ZITADEL v4 Login V2 architecture.
#
# Routes:
#   /ui/v2/login/*  →  zitadel-login:3000   (Next.js Login V2 UI)
#   everything else →  zitadel:8080         (ZITADEL API + Console)

upstream zitadel_core {
    server zitadel:8080;
}

upstream zitadel_login {
    server zitadel-login:3000;
}

server {
    listen 80;
    server_name _;

    # Preserve the original Host header (with port) so ZITADEL
    # generates correct issuer URLs and redirect URIs.
    # Without this, ZITADEL sees Host=localhost (no port) and
    # produces issuer=http://localhost instead of http://localhost:8080.

    # --- Login V2 UI (Next.js) ---
    # All /ui/v2/login/* paths go to the zitadel-login container.
    location /ui/v2/login {
        proxy_pass http://zitadel_login;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- ZITADEL API + Console (everything else) ---
    location / {
        proxy_pass http://zitadel_core;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
